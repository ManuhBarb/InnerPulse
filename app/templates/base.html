{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Pulse</title>
    <!-- Inclusão do bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Inclusão de páginas css -->
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static  'css/base.css' %}">
    <link rel="stylesheet" href="{% static  'css/partials/_header.css' %}">
    <link rel="stylesheet" href="{% static  'css/partials/_footer.css' %}">

    <link rel="stylesheet" href="{% static  'css/agendamento.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'imagens/favicon.png' %}" type="image/x-icon">

</head>

<body>

    {% include 'partials/_header.html' %}

    <main>
        <div>
            {% block content %}
            {% endblock %}
        </div>
    </main>

    {% include 'partials/_footer.html' %}

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
