{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="ip-container">

    <div class="ip-calendario">
        <h2>Calendário</h2>

        <div class="ip-header-selects">
            <select id="mesSelect"></select>
            <select id="anoSelect"></select>
        </div>

        <div class="ip-calendar-grid" id="calendario"></div>
    </div>

    <div class="ip-formulario">
        <h2>Adicionar compromisso</h2>

        <label>Data selecionada:</label>
        <input type="text" id="dataSelecionada" readonly placeholder="Nenhuma data">

        <input type="text" id="tituloEvento" placeholder="Título do compromisso">

        <input type="time" id="horaEvento">

        <button onclick="adicionarEvento()">Salvar compromisso</button>

        <div class="ip-eventos">
            <h3>Compromissos salvos</h3>
            <div id="listaEventos"></div>
        </div>
    </div>

</div>

<script>
    const usuarioID = "{{ request.user.id }}";
    const STORAGE_KEY = "ip-eventos-user-" + usuarioID;


    const calendario = document.getElementById("calendario");
    const mesSelect = document.getElementById("mesSelect");
    const anoSelect = document.getElementById("anoSelect");
    const dataSelecionada = document.getElementById("dataSelecionada");
    const listaEventosDiv = document.getElementById("listaEventos");

    let eventos = [];
    let dataAtual = new Date();

    function salvarEventosStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(eventos || []));
    }

    function carregarEventosStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        eventos = raw ? JSON.parse(raw) : [];
    }


    function preencherSelects() {
        const meses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        mesSelect.innerHTML = "";
        anoSelect.innerHTML = "";

        meses.forEach((m, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = m;
            if (i === dataAtual.getMonth()) opt.selected = true;
            mesSelect.appendChild(opt);
        });

        for (let ano = 1990; ano <= 2050; ano++) {
            const opt = document.createElement("option");
            opt.value = ano;
            opt.textContent = ano;
            if (ano === dataAtual.getFullYear()) opt.selected = true;
            anoSelect.appendChild(opt);
        }
    }

    function formataDDMMYYYY(dia, mes, ano) {
        const dd = String(dia).padStart(2, "0");
        const mm = String(mes).padStart(2, "0");
        return `${dd}/${mm}/${ano}`;
    }

    function temEventoNaData(dataStr) {
        if (!eventos || eventos.length === 0) return false;
        return eventos.some(ev => ev.data === dataStr);
    }

    function gerarCalendario() {
        calendario.innerHTML = "";

        const mes = parseInt(mesSelect.value, 10);
        const ano = parseInt(anoSelect.value, 10);

        const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
        const ultimoDia = new Date(ano, mes + 1, 0).getDate();

        for (let i = 0; i < primeiroDiaSemana; i++) {
            const spacer = document.createElement("div");
            spacer.className = "ip-day ip-day--empty";
            spacer.style.background = "transparent";
            spacer.style.border = "none";
            calendario.appendChild(spacer);
        }

        for (let dia = 1; dia <= ultimoDia; dia++) {
            const cell = document.createElement("div");
            cell.className = "ip-day";
            cell.textContent = dia;

            const dataStr = formataDDMMYYYY(dia, mes + 1, ano);

            if (temEventoNaData(dataStr)) {
                cell.classList.add("ip-day-evento");
            }

            cell.addEventListener("click", () => {
                document.querySelectorAll(".ip-day").forEach(d => d.classList.remove("ip-selected"));
                cell.classList.add("ip-selected");
                dataSelecionada.value = dataStr;
            });

            calendario.appendChild(cell);
        }
    }

    function atualizarLista() {
        listaEventosDiv.innerHTML = "";
        if (!eventos || eventos.length === 0) {
            listaEventosDiv.innerHTML = "<p style='color:#666;margin:0;'>Nenhum compromisso</p>";
            return;
        }

        eventos.forEach((ev, i) => {
            const item = document.createElement("div");
            item.className = "ip-evento-item";

            const texto = document.createElement("span");
            const horaFinal = ev.hora && ev.hora.trim() !== "" ? ev.hora : "Sem horário";

            texto.innerHTML = `<strong>${ev.data}</strong> — ${horaFinal} — ${ev.titulo}`;

            const btn = document.createElement("button");
            btn.className = "ip-remover";
            btn.type = "button";
            btn.setAttribute("aria-label", "Remover compromisso");
            btn.textContent = "X";
            btn.addEventListener("click", () => {
                const confirmar = confirm("Tem certeza que deseja excluir?");
                if (!confirmar) return;

                eventos.splice(i, 1);
                salvarEventosStorage();
                atualizarLista();
                gerarCalendario();
            });


            item.appendChild(texto);
            item.appendChild(btn);
            listaEventosDiv.appendChild(item);
        });
    }

    function adicionarEvento() {
        if (!usuarioID || usuarioID === "None") {
            alert("Você precisa estar logado para salvar compromissos.");
            return;
        }

        const data = dataSelecionada.value;
        const titulo = document.getElementById("tituloEvento").value.trim();
        let hora = document.getElementById("horaEvento").value;

        if (!data) return alert("Selecione uma data no calendário.");
        if (!titulo) return alert("Digite um título.");

        if (!hora || hora.trim() === "") {
            hora = "Sem horário";
        }

        eventos.push({ data, titulo, hora });
        salvarEventosStorage();

        document.getElementById("tituloEvento").value = "";
        document.getElementById("horaEvento").value = "";

        atualizarLista();
        gerarCalendario();
    }

    function init() {
        carregarEventosStorage();
        preencherSelects();
        atualizarLista();
        gerarCalendario();
        mesSelect.addEventListener("change", gerarCalendario);
        anoSelect.addEventListener("change", gerarCalendario);
    }

    window.adicionarEvento = adicionarEvento;

    init();

    // -------------------------------Verificação de login----------------------------------------- //

    

</script>


</body>

</html>
{% endblock %}
