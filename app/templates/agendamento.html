{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="ip-container">
    <div class="ip-calendario">
        <h2>Calendário</h2>
        <div class="ip-header-selects">
            <select id="mesSelect"></select>
            <select id="anoSelect"></select>
        </div>
        <div class="ip-calendar-grid" id="calendario"></div>
    </div>

    <div class="ip-formulario">
        <h2>Adicionar compromisso</h2>
        <label>Data selecionada:</label>
        <input type="text" id="dataSelecionada" readonly placeholder="Nenhuma data">
        <input type="text" id="tituloEvento" placeholder="Título do compromisso">
        <input type="time" id="horaEvento">
        <button onclick="adicionarEvento()">Salvar compromisso</button>
        
        <div class="ip-eventos">
            <h3>Compromissos salvos</h3>
            <div id="listaEventos"></div>
        </div>
    </div>
</div>

<script>
    // Chave única baseada no ID do usuário
    const usuarioID = "{{ request.user.id }}";
    const STORAGE_KEY = "agendamentos_user_" + usuarioID;

    let eventos = [];
    let dataAtual = new Date();

    // Carregar eventos do localStorage
    function carregarEventos() {
        const dados = localStorage.getItem(STORAGE_KEY);
        eventos = dados ? JSON.parse(dados) : [];
    }

    // Salvar eventos no localStorage
    function salvarEventos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(eventos));
    }

    // Preencher selects de mês e ano
    function preencherSelects() {
        const meses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        // Limpar selects
        document.getElementById("mesSelect").innerHTML = '';
        document.getElementById("anoSelect").innerHTML = '';

        // Adicionar meses
        meses.forEach((mes, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.textContent = mes;
            if (index === dataAtual.getMonth()) option.selected = true;
            document.getElementById("mesSelect").appendChild(option);
        });

        // Adicionar anos (2025-2030)
        for (let ano = 2025; ano <= 2030; ano++) {
            const option = document.createElement("option");
            option.value = ano;
            option.textContent = ano;
            if (ano === dataAtual.getFullYear()) option.selected = true;
            document.getElementById("anoSelect").appendChild(option);
        }
    }

    // Formatar data DD/MM/YYYY
    function formatarData(dia, mes, ano) {
        return `${dia.toString().padStart(2, '0')}/${(mes).toString().padStart(2, '0')}/${ano}`;
    }

    // Verificar se há evento em uma data
    function temEventoNaData(dataStr) {
        return eventos.some(evento => evento.data === dataStr);
    }

    // Gerar calendário
    function gerarCalendario() {
        const calendario = document.getElementById("calendario");
        calendario.innerHTML = '';

        const mes = parseInt(document.getElementById("mesSelect").value);
        const ano = parseInt(document.getElementById("anoSelect").value);

        // Primeiro dia do mês
        const primeiroDia = new Date(ano, mes, 1).getDay();
        const ultimoDia = new Date(ano, mes + 1, 0).getDate();

        // Dias vazios no início
        for (let i = 0; i < primeiroDia; i++) {
            const diaVazio = document.createElement("div");
            diaVazio.className = "ip-day ip-day--empty";
            calendario.appendChild(diaVazio);
        }

        // Dias do mês
        for (let dia = 1; dia <= ultimoDia; dia++) {
            const diaElement = document.createElement("div");
            diaElement.className = "ip-day";
            diaElement.textContent = dia;

            const dataStr = formatarData(dia, mes + 1, ano);

            // Marcar se tem evento
            if (temEventoNaData(dataStr)) {
                diaElement.classList.add("ip-day-evento");
            }

            // Selecionar data
            diaElement.addEventListener("click", function() {
                document.querySelectorAll(".ip-day").forEach(d => d.classList.remove("ip-selected"));
                this.classList.add("ip-selected");
                document.getElementById("dataSelecionada").value = dataStr;
            });

            calendario.appendChild(diaElement);
        }
    }

    // Atualizar lista de eventos
    function atualizarLista() {
        const lista = document.getElementById("listaEventos");
        lista.innerHTML = '';

        if (eventos.length === 0) {
            lista.innerHTML = '<p style="color:#666;">Nenhum compromisso salvo</p>';
            return;
        }

        // Ordenar por data (mais recente primeiro)
        eventos.sort((a, b) => {
            const [diaA, mesA, anoA] = a.data.split('/').map(Number);
            const [diaB, mesB, anoB] = b.data.split('/').map(Number);
            return new Date(anoB, mesB - 1, diaB) - new Date(anoA, mesA - 1, diaA);
        });

        // Adicionar cada evento
        eventos.forEach((evento, index) => {
            const item = document.createElement("div");
            item.className = "ip-evento-item";

            const texto = document.createElement("span");
            const hora = evento.hora === "Sem horário" ? "" : ` - ${evento.hora}`;
            texto.innerHTML = `<strong>${evento.data}</strong>${hora} - ${evento.titulo}`;

            const botao = document.createElement("button");
            botao.className = "ip-remover";
            botao.textContent = "X";
            botao.onclick = function() {
                if (confirm("Excluir este compromisso?")) {
                    eventos.splice(index, 1);
                    salvarEventos();
                    atualizarLista();
                    gerarCalendario();
                }
            };

            item.appendChild(texto);
            item.appendChild(botao);
            lista.appendChild(item);
        });
    }

    // Adicionar novo evento
    function adicionarEvento() {
        const data = document.getElementById("dataSelecionada").value;
        const titulo = document.getElementById("tituloEvento").value.trim();
        let hora = document.getElementById("horaEvento").value;

        // Validações
        if (!data) return alert("Selecione uma data no calendário.");
        if (!titulo) return alert("Digite um título para o compromisso.");

        // Se não tiver hora, define como "Sem horário"
        if (!hora) hora = "Sem horário";

        // Adicionar evento
        eventos.push({
            data: data,
            titulo: titulo,
            hora: hora
        });

        // Salvar e atualizar
        salvarEventos();
        atualizarLista();
        gerarCalendario();

        // Limpar formulário
        document.getElementById("tituloEvento").value = "";
        document.getElementById("horaEvento").value = "";
    }

    // Inicializar
    document.addEventListener("DOMContentLoaded", function() {
        carregarEventos();
        preencherSelects();
        gerarCalendario();
        atualizarLista();

        // Event listeners para mudança de mês/ano
        document.getElementById("mesSelect").addEventListener("change", gerarCalendario);
        document.getElementById("anoSelect").addEventListener("change", gerarCalendario);
    });

    // Exportar função para o botão
    window.adicionarEvento = adicionarEvento;
</script>

{% endblock %}
